<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: rgba(14, 14, 16, 0.88);
      --line: rgba(255, 255, 255, 0.08);
      --text: #ece8df;
      --muted: #9a958a;
      --accent: #c9a45c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; font-family: "Segoe UI", Arial, sans-serif; color: var(--text); overflow: hidden; user-select: none; }
    #panel {
      position: absolute; top: 6vh; left: 3vw; width: 420px; max-height: 88vh;
      display: flex; flex-direction: column; background: var(--bg);
      border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    header { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
    .hint { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .gender { display: flex; gap: 8px; margin-top: 12px; }
    .gender button { flex: 1; }
    #rows { overflow-y: auto; padding: 8px 12px; }
    .row { display: grid; grid-template-columns: 96px 32px 1fr 32px; align-items: center; gap: 6px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: none; }
    .label { font-size: 13px; color: var(--muted); }
    .value { font-size: 13px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .value small { display: block; color: var(--muted); font-size: 11px; }
    button {
      background: rgba(255, 255, 255, 0.06); color: var(--text); border: 1px solid var(--line);
      border-radius: 6px; padding: 7px 10px; font-size: 13px; cursor: pointer;
    }
    button:hover { background: rgba(201, 164, 92, 0.2); border-color: var(--accent); }
    button.active { background: rgba(201, 164, 92, 0.3); border-color: var(--accent); }
    footer { display: flex; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
    footer button { flex: 1; }
  </style>
</head>
<body>
  <div id="panel">
    <header>
      <h1>Character</h1>
      <div class="hint">◀ ▶ to change a piece. Changes apply right away. Escape to close.</div>
      <div class="gender">
        <button id="male">Male</button>
        <button id="female">Female</button>
      </div>
    </header>
    <div id="rows"></div>
    <footer>
      <button id="random">Random</button>
      <button id="reset">Reset</button>
      <button id="close">Close</button>
    </footer>
  </div>
  <script src="pieces.js"></script>
  <script>
    const HEADWEAR = ["cap", "fedora", "hat", "flatcap", "helmet", "baret"];
    const HIDDEN = ["skeleton", "temp", "traffichead", "basehead", "arm", "body", "barefootbody"];
    // Categories every character has; the others can be left out.
    const REQUIRED = ["head", "basebody"];
    const LABELS = {
      head: "Face", hair: "Hair", beard: "Beard", mustache: "Mustache", headwear: "Hat",
      glasses: "Glasses", basebody: "Body", shirt: "Shirt", tshirt: "T-shirt", undershirt: "Undershirt",
      tankshirt: "Tank top", blouse: "Blouse", vest: "Vest", jacket: "Jacket", suitjacket: "Suit jacket",
      coat: "Coat", sweather: "Sweater", suit: "Suit", overall: "Overall", onepiece: "One-piece",
      uniform: "Uniform", costume: "Costume", dress: "Dress", skirt: "Skirt", shortskirt: "Short skirt",
      pants: "Pants", jeans: "Jeans", shorts: "Shorts", highpants: "High pants", tights: "Tights",
      shoes: "Shoes", boots: "Boots", sneakers: "Sneakers", gloves: "Gloves", tie: "Tie",
      scarf: "Scarf", watch: "Watch", bag: "Bag", apron: "Apron", earrings: "Earrings",
      earings: "Earrings", ring: "Ring", bra: "Bra", panties: "Panties",
      swimsuit: "Swimsuit", racing: "Racing", shouldersbag: "Handbag", shoulderstrap: "Shoulder strap",
    };
    const ORDER = ["head", "hair", "beard", "mustache", "headwear", "glasses", "earrings", "earings", "basebody",
      "shirt", "tshirt", "undershirt", "tankshirt", "blouse", "bra", "vest", "jacket", "suitjacket", "coat",
      "sweather", "suit", "dress", "overall", "onepiece", "uniform", "costume", "skirt", "shortskirt", "pants",
      "jeans", "shorts", "highpants", "tights", "panties", "shoes", "boots", "sneakers", "gloves", "tie",
      "scarf", "watch", "ring", "bag", "shouldersbag", "apron"];
    const DEFAULTS = {
      ma: ["ma_head_201_tommy_00", "ma_basebody_arm-white_a_tommy", "ma_hair_101_tommy_combed",
        "ma_suitjacket_101_tommy_cab", "ma_pants_101_tommy_vest_", "ma_shoes_104_policeman:1", "ma_cap_109:4"],
    };

    function categoryOf(name) {
      const match = name.match(/^(ma|fe)_([a-z]+)/);
      if (!match) return null;
      return HEADWEAR.includes(match[2]) ? "headwear" : match[2];
    }

    // Piece names by gender, then category.
    const catalog = { ma: {}, fe: {} };
    for (const name of window.OUTFIT_PIECE_NAMES) {
      const gender = name.slice(0, 2);
      const category = categoryOf(name);
      if (!catalog[gender] || !category || HIDDEN.includes(category)) continue;
      (catalog[gender][category] = catalog[gender][category] || []).push(name);
    }
    // A female default: the first face, body, hair, dress and shoes.
    DEFAULTS.fe = ["head", "basebody", "hair", "dress", "shoes"].map((c) => (catalog.fe[c] || [])[0]).filter(Boolean);

    let gender = "ma";
    let outfit = {}; // category -> piece name

    function categories() {
      const present = Object.keys(catalog[gender]);
      return ORDER.filter((c) => present.includes(c)).concat(present.filter((c) => !ORDER.includes(c)).sort());
    }

    function setDefaults() {
      outfit = {};
      for (const name of DEFAULTS[gender]) outfit[categoryOf(name)] = name;
    }

    function pretty(name) {
      // "ma_hair_003_senator-a_blond" -> "003 senator a blond"
      return name.replace(/^(ma|fe)_[a-z]+_?/, "").replace(/[_:-]+/g, " ").trim() || name;
    }

    function step(category, delta) {
      const list = catalog[gender][category];
      const options = REQUIRED.includes(category) ? list : [null].concat(list);
      const current = options.indexOf(outfit[category] || null);
      const next = options[(current + delta + options.length) % options.length];
      if (next) outfit[category] = next; else delete outfit[category];
      render();
      apply();
    }

    function render() {
      document.getElementById("male").classList.toggle("active", gender === "ma");
      document.getElementById("female").classList.toggle("active", gender === "fe");
      const rows = document.getElementById("rows");
      rows.innerHTML = "";
      for (const category of categories()) {
        const list = catalog[gender][category];
        const name = outfit[category];
        const row = document.createElement("div");
        row.className = "row";
        const index = name ? list.indexOf(name) + 1 : 0;
        row.innerHTML = `<div class="label">${LABELS[category] || category}</div>
          <button>◀</button>
          <div class="value">${name ? pretty(name) : "None"}<small>${index}/${list.length}</small></div>
          <button>▶</button>`;
        const buttons = row.querySelectorAll("button");
        buttons[0].addEventListener("click", () => step(category, -1));
        buttons[1].addEventListener("click", () => step(category, 1));
        rows.appendChild(row);
      }
    }

    // Changes are sent a moment after the last click, so stepping through a list does not respawn
    // the character on every piece.
    let applyTimer = null;
    function apply() {
      clearTimeout(applyTimer);
      applyTimer = setTimeout(() => callEvent("outfit:apply", JSON.stringify({ names: Object.values(outfit) })), 350);
    }

    function close() { callEvent("outfit:close", null); }

    document.getElementById("male").addEventListener("click", () => { gender = "ma"; setDefaults(); render(); apply(); });
    document.getElementById("female").addEventListener("click", () => { gender = "fe"; setDefaults(); render(); apply(); });
    document.getElementById("reset").addEventListener("click", () => { setDefaults(); render(); apply(); });
    document.getElementById("random").addEventListener("click", () => {
      for (const category of categories()) {
        const list = catalog[gender][category];
        const optional = !REQUIRED.includes(category);
        // Accessories and extra layers stay off most of the time.
        if (optional && !["hair", "shirt", "pants", "shoes", "dress", "jacket"].includes(category) && Math.random() < 0.75) {
          delete outfit[category];
          continue;
        }
        outfit[category] = list[Math.floor(Math.random() * list.length)];
      }
      render();
      apply();
    });
    document.getElementById("close").addEventListener("click", close);
    window.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });

    setDefaults();
    render();
  </script>
</body>
</html>
